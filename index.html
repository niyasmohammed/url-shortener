<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener & QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f4f4f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: #ffffff;
      padding: 30px 28px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -0.3px;
      margin: 0 0 4px 0;
    }
    .subhead {
      font-size: 0.95rem;
      color: #6c757d;
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 4px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    .input-group input[type="url"] {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #dde0e7;
      border-radius: 10px;
      font-size: 1rem;
      background: #fafbfc;
      transition: border 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .input-group input[type="url"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
      background: #ffffff;
    }
    .input-group input[type="url"]::placeholder {
      color: #aab;
    }
    .input-group button {
      padding: 12px 22px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .input-group button:hover {
      background: #0056b3;
    }
    .input-group button:active {
      transform: scale(0.97);
    }
    .input-group button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      color: #d9534f;
      font-size: 0.9rem;
      margin-top: 12px;
      min-height: 1.5rem;
      font-weight: 500;
    }
    .result-card {
      margin-top: 28px;
      padding: 20px 18px 24px;
      background: #f8f9fc;
      border-radius: 12px;
      border: 1px solid #eef0f4;
      display: none;
      animation: fadeUp 0.35s ease;
    }
    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .result-card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6c757d;
      margin: 0 0 6px 0;
      font-weight: 600;
    }
    .short-link {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 500;
      color: #007bff;
      text-decoration: none;
      word-break: break-all;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .short-link:hover {
      background: #e9f0ff;
      text-decoration: underline;
    }
    #qrcode {
      margin: 18px auto 12px;
      display: flex;
      justify-content: center;
      background: #ffffff;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      max-width: fit-content;
    }
    #qrcode img {
      display: block;
      width: 150px;
      height: 150px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }
    .download-btn,
    .copy-btn {
      padding: 10px 22px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .download-btn {
      background: #28a745;
      color: #fff;
    }
    .download-btn:hover {
      background: #218838;
    }
    .copy-btn {
      background: #6c757d;
      color: #fff;
    }
    .copy-btn:hover {
      background: #5a6268;
    }
    .download-btn:active,
    .copy-btn:active {
      transform: scale(0.97);
    }
    .download-btn svg,
    .copy-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #6c757d;
      background: #e9ecef;
      padding: 2px 12px;
      border-radius: 20px;
      margin-top: 8px;
    }
    .fallback-note {
      font-size: 0.8rem;
      color: #856404;
      background: #fff3cd;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    @media (max-width: 480px) {
      .container {
        padding: 20px 16px 28px;
      }
      .input-group {
        flex-direction: column;
      }
      .input-group button {
        width: 100%;
        justify-content: center;
      }
      #qrcode img {
        width: 130px;
        height: 130px;
      }
      .actions {
        flex-direction: column;
        align-items: stretch;
      }
      .actions button {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔗 Link Shortener</h1>
    <p class="subhead">Create a short link &amp; QR code in seconds</p>

    <div class="form">
      <div class="input-group">
        <input type="url" id="longUrl" placeholder="Paste your long URL (https://…)" required />
        <button id="generateBtn">Generate</button>
      </div>
    </div>

    <p id="error" class="error"></p>

    <div id="resultCard" class="result-card">
      <h3>Your Short Link</h3>
      <a id="shortUrlOutput" class="short-link" href="#" target="_blank"></a>

      <h3 style="margin-top:16px;">QR Code</h3>
      <div id="qrcode"></div>
      <div id="fallbackNote" class="fallback-note" style="display:none;">
        ⚠️ Shortening services unavailable – QR code uses the original URL.
      </div>

      <div class="actions">
        <button id="copyBtn" class="copy-btn">
          <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
          Copy
        </button>
        <button id="downloadBtn" class="download-btn">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Download QR
        </button>
      </div>
      <div class="status-badge" id="serviceBadge">via …</div>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    (function() {
      "use strict";

      // ─── DOM refs ───────────────────────────────────────────────
      const longUrlInput = document.getElementById('longUrl');
      const generateBtn = document.getElementById('generateBtn');
      const errorEl = document.getElementById('error');
      const resultCard = document.getElementById('resultCard');
      const shortUrlOutput = document.getElementById('shortUrlOutput');
      const qrContainer = document.getElementById('qrcode');
      const downloadBtn = document.getElementById('downloadBtn');
      const copyBtn = document.getElementById('copyBtn');
      const serviceBadge = document.getElementById('serviceBadge');
      const fallbackNote = document.getElementById('fallbackNote');
      const toast = document.getElementById('toast');

      let toastTimer = null;
      let currentShortUrl = '';
      let lastOriginalUrl = '';

      // ─── helpers ────────────────────────────────────────────────

      function showToast(msg) {
        toast.textContent = msg || 'Copied!';
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function setError(msg) {
        errorEl.textContent = msg || '';
      }

      function clearError() {
        errorEl.textContent = '';
      }

      function resetResult() {
        resultCard.style.display = 'none';
        qrContainer.innerHTML = '';
        currentShortUrl = '';
        shortUrlOutput.href = '#';
        shortUrlOutput.textContent = '';
        serviceBadge.textContent = 'via …';
        fallbackNote.style.display = 'none';
      }

      function generateQR(text) {
        qrContainer.innerHTML = '';
        try {
          new QRCode(qrContainer, {
            text: text,
            width: 150,
            height: 150,
            colorDark: '#1a1a2e',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H,
          });
        } catch (qrErr) {
          console.warn('QR generation error:', qrErr);
          qrContainer.innerHTML = '<p style="color:#6c757d;font-size:0.85rem;">⚠️ Could not generate QR</p>';
        }
      }

      function showResult(shortUrl, serviceName, isFallback) {
        currentShortUrl = shortUrl;
        shortUrlOutput.href = shortUrl;
        shortUrlOutput.textContent = shortUrl;
        serviceBadge.textContent = 'via ' + (serviceName || 'service');

        generateQR(shortUrl);

        if (isFallback) {
          fallbackNote.style.display = 'block';
          serviceBadge.textContent = '⚠️ No short link – QR for original URL';
        } else {
          fallbackNote.style.display = 'none';
        }

        resultCard.style.display = 'block';
        resultCard.style.animation = 'none';
        requestAnimationFrame(() => {
          resultCard.style.animation = 'fadeUp 0.35s ease';
        });
      }

      // ─── API calls with timeout ─────────────────────────────────

      function fetchWithTimeout(url, options = {}, timeout = 8000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        return fetch(url, { ...options, signal: controller.signal })
          .finally(() => clearTimeout(id));
      }

      // 1) CleanURI (primary)
      async function shortenCleanURI(url) {
        const resp = await fetchWithTimeout('https://cleanuri.com/api/v1/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        }, 10000);
        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(errText || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        if (!data || !data.result_url) throw new Error('Invalid response');
        return data.result_url;
      }

      // 2) Shrtco
      async function shortenShrtco(url) {
        const resp = await fetchWithTimeout(
          `https://api.shrtco.de/v2/shorten?url=${encodeURIComponent(url)}`, {}, 8000
        );
        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(errText || `HTTP ${resp.status}`);
        }
        const data = await resp.json();
        if (!data || !data.ok || !data.result || !data.result.full_short_link) {
          throw new Error('Invalid response');
        }
        return data.result.full_short_link;
      }

      // 3) is.gd (fallback)
      async function shortenIsgd(url) {
        const resp = await fetchWithTimeout(
          `https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`, {}, 8000
        );
        if (!resp.ok) {
          const errText = await resp.text();
          throw new Error(errText || `HTTP ${resp.status}`);
        }
        const text = await resp.text();
        const trimmed = text.trim();
        if (!trimmed.startsWith('http://') && !trimmed.startsWith('https://')) {
          throw new Error('is.gd error: ' + trimmed);
        }
        return trimmed;
      }

      // ─── main generate ──────────────────────────────────────────

      async function generateShortUrl(rawUrl) {
        clearError();
        resetResult();

        let url = rawUrl.trim();
        if (!url) {
          setError('Please enter a valid URL.');
          return;
        }
        if (!/^https?:\/\//i.test(url)) {
          url = 'https://' + url;
        }
        try {
          new URL(url);
        } catch (_) {
          setError('Please enter a valid URL (e.g. https://example.com)');
          return;
        }

        generateBtn.disabled = true;
        generateBtn.textContent = '⏳ Shortening…';

        // Try services in order
        const services = [
          { fn: shortenCleanURI, name: 'CleanURI' },
          { fn: shortenShrtco, name: 'Shrtco' },
          { fn: shortenIsgd, name: 'is.gd' },
        ];

        let shortUrl = null;
        let usedService = '';
        let lastError = '';

        for (const svc of services) {
          try {
            shortUrl = await svc.fn(url);
            usedService = svc.name;
            break;
          } catch (err) {
            console.warn(`[${svc.name}] failed:`, err.message || err);
            lastError = err.message || err;
            // continue
          }
        }

        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate';

        if (shortUrl) {
          showResult(shortUrl, usedService, false);
          setError('');
        } else {
          // All services failed – generate QR for original URL as fallback
          const fallbackMsg = 'Could not generate a short link. The QR code below uses your original URL.';
          setError(fallbackMsg + (lastError ? ` (Last error: ${lastError})` : ''));
          // Show QR for original URL
          showResult(url, 'original (fallback)', true);
          // Also set currentShortUrl to the original URL for copy functionality
          currentShortUrl = url;
          // Update badge to indicate fallback
          serviceBadge.textContent = '⚠️ Fallback – original URL';
        }
      }

      // ─── event listeners ──────────────────────────────────────

      generateBtn.addEventListener('click', () => {
        generateShortUrl(longUrlInput.value.trim());
      });

      longUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          generateBtn.click();
        }
      });

      // ─── copy ──────────────────────────────────────────────────

      copyBtn.addEventListener('click', () => {
        if (!currentShortUrl) {
          showToast('No link to copy');
          return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(currentShortUrl)
            .then(() => showToast('Link copied!'))
            .catch(() => copyFallback(currentShortUrl));
        } else {
          copyFallback(currentShortUrl);
        }
      });

      function copyFallback(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Link copied!');
        } catch (_) {
          showToast('Could not copy. Select the link manually.');
        }
        document.body.removeChild(ta);
      }

      // ─── download QR ──────────────────────────────────────────

      downloadBtn.addEventListener('click', () => {
        const img = qrContainer.querySelector('img');
        if (!img) {
          showToast('No QR code to download');
          return;
        }
        try {
          const link = document.createElement('a');
          link.href = img.src;
          link.download = 'qrcode.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (_) {
          showToast('Download failed');
        }
      });

      // ─── auto-generate from URL param ────────────────────────

      (function initFromUrlParam() {
        const params = new URLSearchParams(window.location.search);
        const urlParam = params.get('url');
        if (urlParam) {
          longUrlInput.value = urlParam;
          generateBtn.click();
        }
      })();

    })();
  </script>

</body>
</html>
