<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>URL Shortener & QR Code Generator</title>
    <link rel="stylesheet" href="style.css" />
    <!-- QRCode.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f4f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: #ffffff;
            padding: 30px 28px 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 520px;
            text-align: center;
            transition: box-shadow 0.2s;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.3px;
            margin: 0 0 4px 0;
        }

        .subhead {
            font-size: 0.95rem;
            color: #6c757d;
            margin-top: 4px;
            margin-bottom: 24px;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input[type="url"] {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #dde0e7;
            border-radius: 10px;
            font-size: 1rem;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-group input[type="url"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
            background: #ffffff;
        }

        .input-group input[type="url"]::placeholder {
            color: #aab;
        }

        .input-group button {
            padding: 12px 22px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .input-group button:hover {
            background: #0056b3;
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        .error {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 12px;
            min-height: 1.5rem;
            font-weight: 500;
        }

        .result-card {
            margin-top: 28px;
            padding: 20px 18px 24px;
            background: #f8f9fc;
            border-radius: 12px;
            border: 1px solid #eef0f4;
            display: none;
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c757d;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .short-link {
            display: inline-block;
            font-size: 1.05rem;
            font-weight: 500;
            color: #007bff;
            text-decoration: none;
            word-break: break-all;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .short-link:hover {
            background: #e9f0ff;
            text-decoration: underline;
        }

        #qrcode {
            margin: 18px auto 12px;
            display: flex;
            justify-content: center;
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            max-width: fit-content;
        }

        #qrcode img {
            display: block;
            width: 150px;
            height: 150px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .download-btn {
            padding: 10px 22px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:hover {
            background: #218838;
        }

        .download-btn:active {
            transform: scale(0.97);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .copy-btn {
            padding: 10px 22px;
            background: #6c757d;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: #5a6268;
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        .status-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #6c757d;
            background: #e9ecef;
            padding: 2px 12px;
            border-radius: 20px;
            margin-top: 8px;
        }

        /* ── toast message ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 16px 28px;
            }
            .input-group {
                flex-direction: column;
            }
            .input-group button {
                width: 100%;
                justify-content: center;
            }
            #qrcode img {
                width: 130px;
                height: 130px;
            }
            .actions {
                flex-direction: column;
                align-items: stretch;
            }
            .actions button {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔗 Link Shortener</h1>
        <p class="subhead">Create a short link &amp; QR code in seconds</p>

        <div class="form">
            <div class="input-group">
                <input type="url" id="longUrl" placeholder="Paste your long URL (https://…)" required />
                <button id="generateBtn">Generate</button>
            </div>
        </div>

        <p id="error" class="error"></p>

        <div id="resultCard" class="result-card">
            <h3>Your Short Link</h3>
            <a id="shortUrlOutput" class="short-link" href="#" target="_blank"></a>

            <h3 style="margin-top:16px;">QR Code</h3>
            <div id="qrcode"></div>

            <div class="actions">
                <button id="copyBtn" class="copy-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy
                </button>
                <button id="downloadBtn" class="download-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                    Download QR
                </button>
            </div>
            <div class="status-badge" id="serviceBadge">via CleanURI</div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast">Copied to clipboard!</div>

    <script>
        (function() {
            "use strict";

            // ─── DOM refs ───────────────────────────────────────────────
            const longUrlInput = document.getElementById('longUrl');
            const generateBtn = document.getElementById('generateBtn');
            const errorEl = document.getElementById('error');
            const resultCard = document.getElementById('resultCard');
            const shortUrlOutput = document.getElementById('shortUrlOutput');
            const qrContainer = document.getElementById('qrcode');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const serviceBadge = document.getElementById('serviceBadge');
            const toast = document.getElementById('toast');

            let toastTimer = null;
            let currentShortUrl = '';

            // ─── helpers ────────────────────────────────────────────────

            function showToast(msg) {
                toast.textContent = msg || 'Copied!';
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            function setError(msg) {
                errorEl.textContent = msg || '';
            }

            function clearError() {
                errorEl.textContent = '';
            }

            function resetResult() {
                resultCard.style.display = 'none';
                qrContainer.innerHTML = '';
                currentShortUrl = '';
                shortUrlOutput.href = '#';
                shortUrlOutput.textContent = '';
                serviceBadge.textContent = 'via …';
            }

            function showResult(shortUrl, serviceName) {
                currentShortUrl = shortUrl;
                shortUrlOutput.href = shortUrl;
                shortUrlOutput.textContent = shortUrl;
                serviceBadge.textContent = 'via ' + (serviceName || 'service');

                // Generate QR code
                qrContainer.innerHTML = '';
                try {
                    new QRCode(qrContainer, {
                        text: shortUrl,
                        width: 150,
                        height: 150,
                        colorDark: '#1a1a2e',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H,
                    });
                } catch (qrErr) {
                    console.warn('QR generation error:', qrErr);
                    qrContainer.innerHTML =
                        '<p style="color:#6c757d;font-size:0.85rem;">⚠️ Could not generate QR</p>';
                }

                resultCard.style.display = 'block';
                // Re-trigger fade animation
                resultCard.style.animation = 'none';
                requestAnimationFrame(() => {
                    resultCard.style.animation = 'fadeUp 0.35s ease';
                });
            }

            // ─── API calls ─────────────────────────────────────────────

            // Primary: CleanURI (CORS-friendly, reliable)
            async function shortenWithCleanURI(url) {
                const resp = await fetch('https://cleanuri.com/api/v1/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                });
                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(errText || `HTTP ${resp.status}`);
                }
                const data = await resp.json();
                if (!data || !data.result_url) {
                    throw new Error('Invalid response from CleanURI');
                }
                return data.result_url;
            }

            // Fallback: Shrtco (CORS-friendly)
            async function shortenWithShrtco(url) {
                const resp = await fetch(
                    `https://api.shrtco.de/v2/shorten?url=${encodeURIComponent(url)}`
                );
                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(errText || `HTTP ${resp.status}`);
                }
                const data = await resp.json();
                if (!data || !data.ok || !data.result || !data.result.full_short_link) {
                    throw new Error('Invalid response from Shrtco');
                }
                return data.result.full_short_link;
            }

            // Final fallback: is.gd (still works for many cases, CORS may be limited)
            async function shortenWithIsgd(url) {
                const resp = await fetch(
                    `https://is.gd/create.php?format=simple&url=${encodeURIComponent(url)}`
                );
                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(errText || `HTTP ${resp.status}`);
                }
                const text = await resp.text();
                const trimmed = text.trim();
                if (!trimmed.startsWith('http://') && !trimmed.startsWith('https://')) {
                    throw new Error('is.gd returned an error: ' + trimmed);
                }
                return trimmed;
            }

            // ─── main generate ─────────────────────────────────────────

            async function generateShortUrl(rawUrl) {
                clearError();
                resetResult();

                // Validate & format URL
                let url = rawUrl.trim();
                if (!url) {
                    setError('Please enter a valid URL.');
                    return;
                }
                if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }
                // Basic URL validity check
                try {
                    new URL(url);
                } catch (_) {
                    setError('Please enter a valid URL (e.g. https://example.com)');
                    return;
                }

                // Disable button during request
                generateBtn.disabled = true;
                generateBtn.textContent = '⏳ Shortening…';
                const originalBtnText = 'Generate';

                try {
                    let shortUrl = null;
                    let service = '';

                    // 1) Try CleanURI
                    try {
                        shortUrl = await shortenWithCleanURI(url);
                        service = 'CleanURI';
                    } catch (cleanErr) {
                        console.warn('CleanURI failed:', cleanErr);
                        // 2) Try Shrtco
                        try {
                            shortUrl = await shortenWithShrtco(url);
                            service = 'Shrtco';
                        } catch (shrtcoErr) {
                            console.warn('Shrtco failed:', shrtcoErr);
                            // 3) Try is.gd (last resort)
                            try {
                                shortUrl = await shortenWithIsgd(url);
                                service = 'is.gd';
                            } catch (isgdErr) {
                                console.warn('is.gd failed:', isgdErr);
                                throw new Error(
                                    'All shortening services are temporarily unavailable. Please try again later.'
                                );
                            }
                        }
                    }

                    if (!shortUrl) {
                        throw new Error('No short URL generated');
                    }

                    showResult(shortUrl, service);
                    setError('');

                } catch (err) {
                    console.error('Shortening error:', err);
                    setError(err.message || 'Failed to generate short link. Please check your network and try again.');
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.textContent = originalBtnText;
                }
            }

            // ─── event: generate ──────────────────────────────────────

            generateBtn.addEventListener('click', () => {
                const raw = longUrlInput.value.trim();
                generateShortUrl(raw);
            });

            // Allow Enter key on input
            longUrlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generateBtn.click();
                }
            });

            // ─── copy link ────────────────────────────────────────────

            copyBtn.addEventListener('click', () => {
                if (!currentShortUrl) {
                    showToast('No link to copy');
                    return;
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(currentShortUrl)
                        .then(() => showToast('Link copied!'))
                        .catch(() => {
                            // fallback
                            copyFallback(currentShortUrl);
                        });
                } else {
                    copyFallback(currentShortUrl);
                }
            });

            function copyFallback(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('Link copied!');
                } catch (_) {
                    showToast('Could not copy. Select the link manually.');
                }
                document.body.removeChild(ta);
            }

            // ─── download QR ──────────────────────────────────────────

            downloadBtn.addEventListener('click', () => {
                const img = qrContainer.querySelector('img');
                if (!img) {
                    showToast('No QR code to download');
                    return;
                }
                try {
                    const link = document.createElement('a');
                    link.href = img.src;
                    link.download = 'qrcode.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                } catch (_) {
                    showToast('Download failed');
                }
            });

            // ─── auto-generate from URL param ─────────────────────────

            (function initFromUrlParam() {
                const params = new URLSearchParams(window.location.search);
                const urlParam = params.get('url');
                if (urlParam) {
                    longUrlInput.value = urlParam;
                    generateBtn.click();
                }
            })();

        })();
    </script>

</body>
</html>
